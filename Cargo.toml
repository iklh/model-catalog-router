[package]
name = "model-catalog-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Route Codex model catalog entries to multiple OpenAI-compatible providers"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.7"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
dotenvy = "0.15"
futures-util = "0.3"
http = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
toml = "0.8"
toml_edit = "0.22"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "=2.4.1", features = ["serde"] }
